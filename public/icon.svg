<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Floor Drop Shadow Filter -->
    <filter id="binDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="0" dy="24" result="offsetblur" />
      <feFlood flood-color="#022c22" flood-opacity="0.45" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Bin Body Volumetric Lighting Gradient -->
    <linearGradient id="binBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="18%" stop-color="#059669" />
      <stop offset="65%" stop-color="#047857" />
      <stop offset="90%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Lid Top Gradient -->
    <linearGradient id="lidTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="25%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Lid Rim Front Lip Gradient -->
    <linearGradient id="lidLipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="25%" stop-color="#10b981" />
      <stop offset="75%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Handle Metallic Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Wheel Rubber Gradient -->
    <radialGradient id="wheelTireGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="65%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Wheel Rim Metallic Gradient -->
    <linearGradient id="wheelHubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Inset Groove Shadow Gradient -->
    <linearGradient id="grooveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#022c22" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Specular Highlight Gloss -->
    <linearGradient id="specularGloss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Clean Recycling Emblem Gradient (Tone on Tone) -->
    <linearGradient id="recycleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Ambient Ground Shadow Under Bin -->
  <ellipse cx="256" cy="466" rx="175" ry="24" fill="#022c22" opacity="0.35" filter="blur(10px)" />
  <ellipse cx="256" cy="466" rx="135" ry="14" fill="#000000" opacity="0.4" filter="blur(6px)" />

  <g filter="url(#binDropShadow)">
    <!-- BACK WHEELS & AXLE (Mounted behind bin base) -->
    <!-- Left Wheel -->
    <g transform="translate(108, 412)">
      <ellipse cx="0" cy="0" rx="28" ry="42" fill="url(#wheelTireGrad)" />
      <ellipse cx="0" cy="0" rx="17" ry="26" fill="url(#wheelHubGrad)" />
      <circle cx="0" cy="0" r="7" fill="#0f172a" />
      <circle cx="0" cy="0" r="3" fill="#e2e8f0" />
    </g>
    <!-- Right Wheel -->
    <g transform="translate(404, 412)">
      <ellipse cx="0" cy="0" rx="28" ry="42" fill="url(#wheelTireGrad)" />
      <ellipse cx="0" cy="0" rx="17" ry="26" fill="url(#wheelHubGrad)" />
      <circle cx="0" cy="0" r="7" fill="#0f172a" />
      <circle cx="0" cy="0" r="3" fill="#e2e8f0" />
    </g>

    <!-- MAIN TRASH CAN BODY -->
    <!-- Tapered container body: wider at top, narrower at bottom -->
    <path d="M 124 168 
             L 152 444 
             Q 154 456 166 456 
             L 346 456 
             Q 358 456 360 444 
             L 388 168 
             Z"
          fill="url(#binBodyGrad)" />

    <!-- Bottom Structural Foot Bumper Rim -->
    <path d="M 148 438 
             L 152 452 
             Q 154 460 166 460 
             L 346 460 
             Q 358 460 360 452 
             L 364 438 
             Z"
          fill="#022c22" opacity="0.9" />
    <path d="M 152 446 L 360 446 L 358 452 L 154 452 Z" fill="#064e3b" />

    <!-- 3D Structural Vertical Reinforcement Ribs -->
    <!-- Left Rib 1 -->
    <path d="M 174 192 L 190 432 L 198 432 L 182 192 Z" fill="url(#grooveGrad)" opacity="0.8" />
    <line x1="174" y1="192" x2="190" y2="432" stroke="#6ee7b7" stroke-width="2" opacity="0.4" />

    <!-- Left Rib 2 -->
    <path d="M 222 192 L 230 432 L 238 432 L 230 192 Z" fill="url(#grooveGrad)" opacity="0.8" />
    <line x1="222" y1="192" x2="230" y2="432" stroke="#6ee7b7" stroke-width="2" opacity="0.3" />

    <!-- Right Rib 3 -->
    <path d="M 274 192 L 274 432 L 282 432 L 282 192 Z" fill="url(#grooveGrad)" opacity="0.8" />
    <line x1="282" y1="192" x2="282" y2="432" stroke="#022c22" stroke-width="2" opacity="0.6" />

    <!-- Right Rib 4 -->
    <path d="M 322 192 L 314 432 L 322 432 L 330 192 Z" fill="url(#grooveGrad)" opacity="0.8" />
    <line x1="330" y1="192" x2="322" y2="432" stroke="#022c22" stroke-width="2" opacity="0.8" />

    <!-- Body Specular Gloss Curve (Left Shoulder) -->
    <path d="M 125 168 L 153 444 L 178 444 L 150 168 Z" fill="url(#specularGloss)" />

    <!-- UNIVERSAL EMBOSSED RECYCLING SYMBOL (Clean iconography - NO TEXT) -->
    <g transform="translate(256, 310) scale(1.15)" opacity="0.85">
      <!-- Shadow of recycle icon -->
      <g stroke="#022c22" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.5" transform="translate(0, 3)">
        <!-- Top Loop -->
        <path d="M -16 -22 C -6 -36 18 -36 28 -20 L 34 -30 L 40 -10 L 20 -10 L 26 -18 C 18 -30 -2 -30 -10 -16 Z" />
        <!-- Right Loop -->
        <path d="M 32 -4 C 40 12 28 34 10 40 L 14 50 L -4 42 L 4 24 L 8 32 C 22 28 32 10 24 -4 Z" />
        <!-- Left Loop -->
        <path d="M -8 38 C -26 34 -38 14 -34 -4 L -44 -4 L -34 -22 L -24 -4 L -30 -4 C -34 10 -22 26 -6 28 Z" />
      </g>
      <!-- Bright embossed recycle icon -->
      <g fill="url(#recycleGrad)">
        <!-- Top Arrow -->
        <path d="M -16 -22 C -6 -36 18 -36 28 -20 L 34 -30 L 40 -10 L 20 -10 L 26 -18 C 18 -30 -2 -30 -10 -16 Z" />
        <!-- Right Arrow -->
        <path d="M 32 -4 C 40 12 28 34 10 40 L 14 50 L -4 42 L 4 24 L 8 32 C 22 28 32 10 24 -4 Z" />
        <!-- Left Arrow -->
        <path d="M -8 38 C -26 34 -38 14 -34 -4 L -44 -4 L -34 -22 L -24 -4 L -30 -4 C -34 10 -22 26 -6 28 Z" />
      </g>
      <!-- Subtle Center Sanitation Dot -->
      <circle cx="2" cy="6" r="4" fill="#a7f3d0" opacity="0.9" />
    </g>

    <!-- UPPER COLLAR / RIM OF BIN BODY -->
    <path d="M 116 160 
             Q 114 168 122 172 
             L 390 172 
             Q 398 168 396 160 
             L 392 152 
             L 120 152 
             Z"
          fill="#047857" stroke="#022c22" stroke-width="2" />
    <line x1="122" y1="171" x2="390" y2="171" stroke="#022c22" stroke-width="3" opacity="0.6" />

    <!-- REAR LIFT HANDLE (Behind Lid) -->
    <g transform="translate(256, 82)">
      <path d="M -60 14 C -60 -4 -42 -12 0 -12 C 42 -12 60 -4 60 14 L 46 14 C 46 4 32 -2 0 -2 C -32 -2 -46 4 -46 14 Z"
            fill="url(#handleGrad)" stroke="#090d16" stroke-width="2" />
      <rect x="-64" y="10" width="16" height="12" rx="3" fill="#1e293b" />
      <rect x="48" y="10" width="16" height="12" rx="3" fill="#0f172a" />
    </g>

    <!-- 3D HINGED LID -->
    <!-- Lid Shadow cast onto upper body -->
    <path d="M 110 162 L 402 162 L 396 182 L 116 182 Z" fill="#022c22" opacity="0.5" filter="blur(3px)" />

    <!-- Lid Main Shell (Curved aerodynamic heavy-duty plastic lid) -->
    <path d="M 108 148 
             C 106 132 124 112 168 106 
             C 212 100 300 100 344 106 
             C 388 112 406 132 404 148 
             L 408 162 
             Q 408 166 400 166 
             L 112 166 
             Q 104 166 104 162 
             Z"
          fill="url(#lidTopGrad)" />

    <!-- Lid Front Overhang Bevel Lip -->
    <path d="M 104 154 
             L 408 154 
             Q 412 164 402 166 
             L 110 166 
             Q 100 164 104 154 
             Z"
          fill="url(#lidLipGrad)" />

    <!-- Lid Front Ergonomic Grip Inset (Center front handle lip) -->
    <path d="M 206 156 
             Q 206 166 216 166 
             L 296 166 
             Q 306 166 306 156 
             Z"
          fill="#022c22" opacity="0.85" />
    <path d="M 212 158 L 300 158 L 296 163 L 216 163 Z" fill="#064e3b" />

    <!-- Lid Top Highlight Crest Line -->
    <path d="M 124 140 
             C 140 120 180 110 256 108 
             C 332 110 372 120 388 140"
          fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" opacity="0.75" />

    <!-- Lid Specular Reflection Corner -->
    <ellipse cx="152" cy="126" rx="28" ry="10" transform="rotate(-12, 152, 126)" fill="#ffffff" opacity="0.3" filter="blur(2px)" />

    <!-- Rear Hinge Knuckles -->
    <rect x="156" y="96" width="22" height="14" rx="4" fill="#1e293b" stroke="#090d16" stroke-width="1.5" />
    <rect x="334" y="96" width="22" height="14" rx="4" fill="#0f172a" stroke="#090d16" stroke-width="1.5" />
  </g>
</svg>
